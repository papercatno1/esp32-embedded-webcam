; PlatformIO 工程：ESP32-S3-LCD-2 网页图传（MVP）
; 板子：微雪 Waveshare ESP32-S3-LCD-2（ESP32-S3R8 / 8MB OPI PSRAM / 16MB Flash）
; 参考 docs/工具链方案.md、docs/引脚定义.md

[env:esp32s3]
platform  = espressif32@6.7.0
board     = esp32-s3-devkitc-1
framework = arduino

; ---- Flash / PSRAM ----
board_build.arduino.memory_type = qio_opi   ; Flash=QIO, PSRAM=OPI(8MB)
board_build.flash_mode          = qio
board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_build.partitions          = partitions_16MB.csv

; ---- 与出厂固件一致的 USB 配置：保证烧完还能用 COM16 看日志 ----
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DCAMERA_MODEL_ESP32S3_LCD2

; ---- 上传 / 串口 ----
upload_speed  = 460800   ; PIO 上传在这块板的 USB-CDC 上不稳，实际用 scripts\flash.ps1（esptool）
monitor_speed = 115200

; ---- 依赖 ----
; esp32-camera 不在 PlatformIO 官方库索引里，直接从 GitHub 拉
lib_deps =
    https://github.com/espressif/esp32-camera.git
    moononournation/GFX Library for Arduino@1.4.9
lib_ldf_mode = deep+

; 摄像头/HTTP 相关警告太多，关掉一部分保持输出干净
build_unflags = -Werror





