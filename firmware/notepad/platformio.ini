; PlatformIO 工程：ESP32-S3-LCD-2 票据屏（BLE + OTA）M1
; 板子：微雪 Waveshare ESP32-S3-LCD-2（ESP32-S3R8 / 8MB OPI PSRAM / 16MB Flash）
; 参考 docs/引脚定义.md、docs/方案A-票据投屏.md

[env:esp32s3]
platform  = espressif32@6.7.0
board     = esp32-s3-devkitc-1
framework = arduino

; ---- Flash / PSRAM ----
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_build.partitions          = partitions_16MB.csv

; ---- 中文字库二进制嵌入（符号 _binary_data_cjk16_bin_start/end）----
; 生成：python scripts/gen_cjk_font.py
board_build.embed_files = data/cjk16.bin

; ---- USB 配置：烧完仍可用 COM16 看日志 ----
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

; ---- 上传 / 串口 ----
upload_speed  = 460800
monitor_speed = 115200

; ---- 依赖 ----
; NimBLE-Arduino 1.4.x 对应 arduino-esp32 2.x(IDF 4.4)，与平台版本匹配
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
    moononournation/GFX Library for Arduino@1.4.9

build_unflags = -Werror
